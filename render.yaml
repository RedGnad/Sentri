# Render Blueprint for the Sentri multi-vault agent runtime.
# This default service targets the 0G mainnet v2 stack. Only PRIVATE_KEY is
# left blank — paste it manually in the Render UI (Environment tab) so it
# never lives in git.
# Connect this repo in Render → Blueprints → "New Blueprint Instance".
# Render auto-creates the service with the config below.

services:
  - type: web
    name: sentri-agent
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter @steward/sdk run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"
      - key: PRIVATE_KEY
        sync: false
      - key: SENTRI_NETWORK
        value: "mainnet"
      - key: NEXT_PUBLIC_SENTRI_NETWORK
        value: "mainnet"
      - key: RPC_URL
        value: "https://evmrpc.0g.ai"
      - key: MARKET_ASSET
        value: "W0G"
      - key: SENTRI_BASE_SYMBOL
        value: "USDC.E"
      - key: SENTRI_RISK_SYMBOL
        value: "W0G"
      - key: NEXT_PUBLIC_BASE_SYMBOL
        value: "USDC.E"
      - key: NEXT_PUBLIC_RISK_SYMBOL
        value: "W0G"
      # 0G mainnet v2 stack (May 2026).
