# Render Blueprint for the Sentri multi-vault agent runtime.
# This default service targets the 0G mainnet v2 stack. Only PRIVATE_KEY is
# left blank — paste it manually in the Render UI (Environment tab) so it
# never lives in git.
# Connect this repo in Render → Blueprints → "New Blueprint Instance".
# Render auto-creates the service with the config below.

services:
  - type: web
    name: sentri-agent
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm --filter @steward/sdk run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.20.2"
      - key: PRIVATE_KEY
        sync: false
      - key: SENTRI_NETWORK
        value: "mainnet"
      - key: NEXT_PUBLIC_SENTRI_NETWORK
        value: "mainnet"
      - key: RPC_URL
        value: "https://evmrpc.0g.ai"
      - key: MARKET_ASSET
        value: "W0G"
      - key: SENTRI_BASE_SYMBOL
        value: "USDC.E"
      - key: SENTRI_RISK_SYMBOL
        value: "W0G"
      - key: NEXT_PUBLIC_BASE_SYMBOL
        value: "USDC.E"
      - key: NEXT_PUBLIC_RISK_SYMBOL
        value: "W0G"
      # 0G mainnet v2 stack (May 2026).
      - key: NEXT_PUBLIC_VAULT_FACTORY_ADDRESS
        value: "0x9EE0c94c87FaDeB6dFb619B2C429eC05bc623cc7"
      - key: NEXT_PUBLIC_VAULT_IMPLEMENTATION_ADDRESS
        value: "0xf86013C68811047F6dEc98c4ED6601C80B720668"
      - key: NEXT_PUBLIC_AGENT_INFT_ADDRESS
        value: "0x822Ea3f104c5aeA1bb7E34474d641abcf3f87951"
      - key: NEXT_PUBLIC_SWAP_ROUTER_ADDRESS
        value: "0xAdf55d5380f216F53f109B6B8341C9169BaeEBa4"
      - key: NEXT_PUBLIC_SWAP_PAIR_ADDRESS
        value: "0xa9e824Eddb9677fB2189AB9c439238A83695C091"
      - key: NEXT_PUBLIC_PRICE_FEED_ADDRESS
        value: "0x1289638A90da7F24DB069168648819607A7377e6"
      - key: NEXT_PUBLIC_BASE_TOKEN_ADDRESS
        value: "0x1f3AA82227281cA364bFb3d253B0f1af1Da6473E"
      - key: NEXT_PUBLIC_RISK_TOKEN_ADDRESS
        value: "0x1Cd0690fF9a693f5EF2dD976660a8dAFc81A109c"
      - key: NEXT_PUBLIC_DEMO_VAULT_ADDRESS
        value: "0x3C111FFaB9F2C78F62CC27Cc276e65E840DBC982"
      - key: STORAGE_INDEXER_URL
        value: "https://indexer-storage-turbo.0g.ai"
      - key: STORAGE_FLOW_CONTRACT
        value: "0x62D4144dB0F0a6fBBaeb6296c785C71B3D57C526"
      - key: STORAGE_SUBMIT_FEE_WEI
        value: "1000000000000000"
      - key: AGENT_INTERVAL_MS
        value: "60000"
      - key: SENTRI_CACHE_DIR
        value: "/tmp/sentri-cache"
