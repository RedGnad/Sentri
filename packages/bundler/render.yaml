# Render blueprint for the self-hosted Skandha bundler.
# Note: the existing Sentri Render services are configured via the Render UI, not
# a blueprint, so treat this as a reference — create/verify the service + env
# vars in the dashboard. SKANDHA_RELAYERS is a secret (set sync:false, fill in UI).
services:
  - type: web
    name: sentri-bundler
    runtime: docker
    dockerfilePath: ./packages/bundler/Dockerfile
    dockerContext: ./packages/bundler
    envVars:
      # Funded relayer key(s) that submit bundles on 0G. Server-only secret.
      - key: SKANDHA_RELAYERS
        sync: false
      # Network params (override the committed config.json non-secrets).
      - key: SKANDHA_RPC
        value: https://evmrpc.0g.ai
      - key: SKANDHA_ENTRYPOINTS
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
